version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: crm_customers_raw
      - name: erp_customers_raw
      - name: load_batches
        description: >
          Append-only log (scripts/load_bronze.py), one row per ingest run:
          load_batch_id (the UUID shared by every row that run landed, all
          sources, full or incremental), load_type for the run as a whole,
          which sources it touched, and total row count. Looked up at
          compile time by macros/latest_load_batch.sql so the incremental
          silver staging models (stg_crm_customers.sql / stg_erp_customers.sql)
          know which bronze rows belong to "the current batch".
